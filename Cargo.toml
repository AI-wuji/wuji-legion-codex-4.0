[package]
name = "wuji4"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wuji4"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["modern_sqlite"] }
libsqlite3-sys = { version = "=0.38.2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0" }
