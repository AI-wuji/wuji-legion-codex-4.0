[package]
name = "wuji4-dependency-audit"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lock_only.rs"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["modern_sqlite"] }
libsqlite3-sys = { version = "=0.38.2" }
serde = { version = "=1.0.229", features = ["derive"] }
